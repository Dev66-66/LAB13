services:
  nats:
    image: nats:2.10-alpine
    command: ["--http_port", "8222", "--jetstream"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - legal-mas-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - legal-mas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    networks:
      - legal-mas-network
    restart: unless-stopped

  query-analyzer:
    build:
      context: ./agents/universal-agent
    image: lab13-universal-agent
    environment:
      - AGENT_CONFIG=/app/configs/query-analyzer.md
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-mas-network
    restart: unless-stopped

  query-analyzer-2:
    image: lab13-universal-agent
    environment:
      - AGENT_CONFIG=/app/configs/query-analyzer.md
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - query-analyzer
    networks:
      - legal-mas-network
    restart: unless-stopped

  document-searcher:
    image: lab13-universal-agent
    environment:
      - AGENT_CONFIG=/app/configs/document-searcher.md
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - query-analyzer
    networks:
      - legal-mas-network
    restart: unless-stopped

  contradiction-checker:
    image: lab13-universal-agent
    environment:
      - AGENT_CONFIG=/app/configs/contradiction-checker.md
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - query-analyzer
    networks:
      - legal-mas-network
    restart: unless-stopped

  orchestrator:
    build:
      context: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      - SCALE_THRESHOLD=${SCALE_THRESHOLD:-3}
      - ORCHESTRATOR_PORT=${ORCHESTRATOR_PORT:-8000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-mas-network
    restart: unless-stopped

  answer-generator:
    build:
      context: ./agents/answer-generator
    environment:
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-mas-network
    restart: unless-stopped

  monitoring:
    build:
      context: ./monitoring
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JAEGER_URL=${JAEGER_URL:-http://localhost:16686}
      - MONITORING_PORT=${MONITORING_PORT:-8080}
    depends_on:
      - redis
    networks:
      - legal-mas-network
    restart: unless-stopped

networks:
  legal-mas-network:
    driver: bridge

volumes:
  redis-data:
